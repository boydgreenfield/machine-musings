# coverset on Fly.io, stateless: one always-on Machine with no volume; the state is in Postgres
# (Fly Managed Postgres or Neon) and a Tigris bucket. deploy/fly/README.md has the commands.
# `fly launch --no-deploy --copy-config --config deploy/fly/fly.toml` rewrites `app` to the name you pick.

app = "coverset-CHANGEME"
primary_region = "iad"

# `coverset serve` drains in-flight requests on SIGTERM (10 s), then the warm pool.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  # Run `fly deploy` from the project root (the build context); the README passes
  # `--dockerfile Dockerfile` too, so the path below (relative to this file) is only a fallback.
  dockerfile = "../../Dockerfile"

[env]
  COVERSET_ENV = "prod"
  COVERSET_BIND = "0.0.0.0:8000"
  # Only a cache when COVERSET_DATABASE_URL and COVERSET_BLOB_URL are set (secrets): the Machine's
  # own disk, lost on every deploy, and that is fine.
  COVERSET_DATA_DIR = "/data"
  COVERSET_CACHE_DIR = "/var/cache/coverset"
  # `serve` runs `coverset init-db` before it listens. Several Machines starting together migrate
  # one after the other (an advisory lock); to migrate once per deploy instead, set "false" and
  # uncomment `release_command` under [deploy].
  COVERSET_MIGRATE_ON_START = "true"
  # Fly's proxy ends X-Forwarded-For with the app's own IP; on a Fly Machine (FLY_APP_NAME is set)
  # coverset takes the client from Fly-Client-IP instead, and the scheme from X-Forwarded-Proto.
  COVERSET_TRUST_PROXY = "true"
  COVERSET_EXECUTOR = "modal"
  COVERSET_MODAL_ENVIRONMENT = "coverset"

# No [[mounts]]: nothing on the Machine's disk must survive a restart once the two URLs are secrets.
# (A volume pins a Machine to one host and forces in-place deploys; without one Fly can replace it
# anywhere in the region.)

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: webhooks must not wait for a cold start, and the dispatcher, reaper and warm-pool
  # maintainer run in this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Requests, not connections: SSE streams are long-lived requests.
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [http_service.http_options]
    # coverset's SSE streams send ": ping" every 15 s, well inside this.
    idle_timeout = 600

  [[http_service.checks]]
    # Generous: the first boot migrates an empty database before the port opens.
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  # Replaced one Machine at a time and checked against /healthz. With one Machine that is a few
  # seconds of 502s; `fly scale count 2` removes them: on Postgres the leader lease runs the
  # dispatcher, reaper and gc in one Machine and the other serves requests (docs/deploy.md, "Scaling").
  strategy = "rolling"
  # Migrate once per deploy in a temporary Machine from the new image (the image's entrypoint is
  # `coverset`, so this runs `coverset init-db`), with COVERSET_MIGRATE_ON_START = "false" above:
  # release_command = "init-db"
