# coverset + Postgres 17 + Caddy (automatic HTTPS) on one VM. docs/deploy.md, deploy/aws/README.md.
#
#   cd deploy && cp coverset.env.example coverset.env   # admin token, URL, Modal token, database URL
#   cp services.env.example services.env                # POSTGRES_PASSWORD (the one in the database URL)
#   COVERSET_DOMAIN=coverset.example.com docker compose up -d --build
#
# Caddy terminates TLS (Let's Encrypt for a real domain; `COVERSET_CADDY_TLS="tls internal"` for a
# self-signed certificate on an IP or a test name) and proxies to coverset, which trusts the
# X-Forwarded-For/-Proto that Caddy sets (COVERSET_TRUST_PROXY=true). Only Caddy publishes ports.
#
# Blobs (facts, uploads, uploaded sources) are files under /data by default. The "hosted" profile
# adds MinIO (S3-compatible) on the same VM, so they live in a bucket the way a hosted deployment
# keeps them and coverset's own container is disposable:
#
#   # services.env: MINIO_ROOT_USER/PASSWORD; coverset.env: COVERSET_BLOB_URL, AWS_ACCESS_KEY_ID/SECRET
#   COMPOSE_PROFILES=hosted COVERSET_DOMAIN=coverset.example.com docker compose up -d --build
name: coverset

services:
  coverset:
    build:
      context: ..
      dockerfile: Dockerfile
    image: coverset:latest
    env_file: ${COVERSET_ENV_FILE:-coverset.env}
    environment:
      COVERSET_BIND: 0.0.0.0:8000
      COVERSET_DATA_DIR: /data
      COVERSET_TRUST_PROXY: "true"
    volumes:
      # The data dir (blobs unless the "hosted" profile's bucket holds them, and the cache with the
      # git mirrors; the App /setup creates is in Postgres). On a VM point COVERSET_DATA_PATH at the
      # attached disk (deploy/aws/user-data.sh: /srv/coverset/data/app, owned by uid 10001).
      - ${COVERSET_DATA_PATH:-coverset-data}:/data
    depends_on:
      postgres:
        condition: service_healthy
      # Only with the "hosted" profile (required: false: absent without it).
      minio-init:
        condition: service_completed_successfully
        required: false
    expose:
      - "8000"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s   # serve drains requests (10 s) and the warm pool before exiting
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  caddy:
    image: caddy:2.10.2
    depends_on:
      coverset:
        condition: service_healthy
    environment:
      COVERSET_DOMAIN: ${COVERSET_DOMAIN:?set COVERSET_DOMAIN to the public host name}
      COVERSET_CADDY_TLS: ${COVERSET_CADDY_TLS:-}
    ports:
      - "${COVERSET_HTTP_PORT:-80}:80"
      - "${COVERSET_HTTPS_PORT:-443}:443"
      - "${COVERSET_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  postgres:
    image: postgres:17
    env_file:
      # POSTGRES_PASSWORD (and nothing else of coverset's settings).
      - path: ${COVERSET_SERVICES_ENV_FILE:-services.env}
    environment:
      POSTGRES_USER: coverset
      POSTGRES_DB: coverset
    volumes:
      # On a VM, COVERSET_PG_DATA_PATH puts it on the attached disk (deploy/aws/user-data.sh does).
      - ${COVERSET_PG_DATA_PATH:-coverset-postgres}:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverset -d coverset"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s   # a clean shutdown checkpoint instead of crash recovery on the next start
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # --- profile "hosted": the bucket ------------------------------------------------------------------
  # MinIO built by Chainguard: MinIO no longer publishes minio/minio or minio/mc images that pull
  # anonymously (deploy/dev-compose.yml uses the same image).
  minio:
    profiles: ["hosted"]
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    user: "0:0"   # named volumes are root-owned; the image's default user cannot write them
    env_file:
      # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD (coverset uses them as AWS_ACCESS_KEY_ID/SECRET).
      - path: ${COVERSET_SERVICES_ENV_FILE:-services.env}
        required: false
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ${COVERSET_MINIO_DATA_PATH:-coverset-minio}:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # One-shot: create the bucket, turn versioning on and expire noncurrent versions after
  # COVERSET_MINIO_NONCURRENT_DAYS (default 30), then exit 0. Every step is idempotent: `ilm import`
  # replaces the bucket's whole lifecycle configuration with this one rule. Without the rule a
  # versioned bucket keeps every object gc, purge or a manifest rewrite deletes, so retention would
  # free no disk on a VM whose disk Postgres shares (docs/deploy.md, "Backups").
  minio-init:
    profiles: ["hosted"]
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: ${COVERSET_SERVICES_ENV_FILE:-services.env}
        required: false
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      COVERSET_BUCKET: ${COVERSET_BUCKET:-coverset}
      COVERSET_MINIO_NONCURRENT_DAYS: ${COVERSET_MINIO_NONCURRENT_DAYS:-30}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set vm http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "vm/$$COVERSET_BUCKET" &&
        mc version enable "vm/$$COVERSET_BUCKET" &&
        printf '{"Rules":[{"ID":"coverset-noncurrent","Status":"Enabled","Filter":{"Prefix":""},"NoncurrentVersionExpiration":{"NoncurrentDays":%s}}]}' "$$COVERSET_MINIO_NONCURRENT_DAYS" |
        mc ilm import "vm/$$COVERSET_BUCKET"
    restart: "no"

volumes:
  coverset-data:
  caddy-data:
  caddy-config:
  coverset-postgres:
  coverset-minio:
