[project]
name = "coverset"
version = "0.1.0"
description = "Anticipatory CI for agent-written Python: tests start when the PR opens, the likeliest failures run first, and every function shows which kinds of input its tests never passed in."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "quart==0.23.1",
  "hypercorn==0.18.0",
  "jinja2>=3.1.6",
  "sqlalchemy[asyncio,aiosqlite]==2.1.4",
  "aiosqlite==0.22.1",
  "alembic==1.20.0",
  "duckdb>=1.5.6,<2",
  "pyarrow==26.0.0",
  "numpy>=2",
  "githubkit[auth-app]==0.16.1",
  "pyjwt[crypto]==2.15.1",
  "pygments==2.21.0",
  "unidiff==1.0.1",
  "markdown-it-py>=3",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "jsonschema>=4",
  "click>=8",
  "modal==1.6.1",
  "anthropic>=1.13,<2",
  "pytest-coverset",
]

[project.scripts]
coverset = "coverset.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "hypothesis==6.168.5",
  "coverage==7.16.2",
  "playwright==1.63.0",
  "pillow>=11",
  "ruff>=0.14",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["examples/*"]

[tool.uv.sources]
pytest-coverset = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverset"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "security: security-focused tests (run with -m security)",
  "modal: live Modal tests (need a Modal token; skipped otherwise)",
  "slow: slow end-to-end tests",
]
timeout = 600

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "packages/pytest-coverset/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
