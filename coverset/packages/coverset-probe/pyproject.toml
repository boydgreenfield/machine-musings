[project]
name = "coverset-probe"
version = "0.1.0"
description = "coverset's production probe: the shape tracer at a low sampling rate in a long-running service, exporting k-anonymous shape keys (never values) per window."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["coverset-model"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverset_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
