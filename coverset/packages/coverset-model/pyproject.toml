[project]
name = "coverset-model"
version = "0.1.0"
description = "coverset's language-neutral semantic-coverage model: the neutral bundle format, type descriptors, shape keys and the input-class catalogue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverset_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
