[project]
name = "pytest-coverset"
version = "0.1.0"
description = "pytest plugin for coverset: per-test coverage, argument shape capture, priority ordering, streamed results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "coverage>=7.16,<8",
  "pytest>=8.2",
]

[project.entry-points.pytest11]
coverset = "pytest_coverset.plugin"

[project.scripts]
coverset-ci = "pytest_coverset.ci:main"

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.168.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_coverset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "security: security-focused tests (run with -m security)",
]
