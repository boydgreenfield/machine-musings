[project]
name = "pyproj-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["attrs>=23.1"]

[project.optional-dependencies]
fast = ["iniconfig>=2"]
all = ["pyproj-app[fast]"]

[dependency-groups]
test = ["pytest>=8.0"]
docs = ["sphinx>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyproj_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
