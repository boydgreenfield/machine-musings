# Alembic CLI configuration for the coverset control-plane database.
# The application migrates programmatically (coverset.db.session.migrate); this file is for
# `uv run alembic ...` during development. The database URL comes from COVERSET_DATABASE_URL
# (or the default under COVERSET_DATA_DIR) unless sqlalchemy.url is set below.

[alembic]
script_location = %(here)s/src/coverset/db/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url =

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
