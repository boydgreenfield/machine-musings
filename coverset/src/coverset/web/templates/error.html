{% extends layout %}
{% block title %}{{ heading }}{% endblock %}
{% block main %}
<section class="panel error-page" role="alert">
  <p class="error-code">HTTP {{ code }}</p>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <p class="muted">{{ hint }}</p>
  <p><a href="{{ url_for('dashboard.index') }}">Go to the dashboard</a></p>
</section>
{% endblock %}
