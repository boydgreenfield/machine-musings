name: CI medical specialties atlas

on:
  push:
    paths:
      - 'medical-specialties/**'
      - '.github/workflows/ci-medical-specialties.yml'
  pull_request:
    paths:
      - 'medical-specialties/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-specialties
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: medical-specialties/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
